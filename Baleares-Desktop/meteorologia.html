    <main>
        <h2>Meteorología de MotoGP-Desktop</h2>
        <script>
            const brno = new Ciudad("Brno", "Republica Checa", "ovetense");
            brno.setPoblacion(402739);
            brno.setCoordenadas(49.195277777778, 16.608333333333);
            brno.setFechaCarrera('2025-08-10');

            brno.parrafoNombre();
            brno.parrafoPais();
            brno.parrafoSecundario();
            brno.parrafoCoordenadas();


            brno.getMeteorologiaCarrera()
                .then(json => brno.procesarJSONCarrera(json))
                .then(datos => brno.mostrarCarrera(datos))
                .catch(err => brno.mostrarError(err));

            brno.getMeteorologiaEntrenos()
                .then(json => brno.procesarJSONEntrenos(json))
                .then(resumen => brno.mostrarEntrenos(resumen))
                .catch(err => brno.mostrarError(err));
        </script>
