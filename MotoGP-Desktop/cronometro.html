<!DOCTYPE HTML>

<html lang="es">

<head>
    <!-- Datos que describen el documento -->
    <meta charset="UTF-8" />

    <meta name="keywords" content="juegos, motogp, moto" />

    <link rel="icon" href="multimedia/imagenes/MotoGP.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="estilo/estilo.css" />
    <link rel="stylesheet" type="text/css" href="estilo/layout.css" />
    <script src="js/cronometro.js"></script>
</head>

<body>
    <!-- Datos con el contenidos que aparece en el navegador -->
    <header>
        <h1><a href="index.html">MotoGP Desktop</a></h1>

        <nav>
            <a href="index.html" accesskey="i">Inicio</a>
            <a href="piloto.html" accesskey="p">Piloto</a>
            <a href="circuito.html" accesskey="c">Circuito</a>
            <a href="meteorologia.html" accesskey="m">Meteorología</a>
            <a href="clasificacion.html" accesskey="s">Clasificación</a>
            <a href="juegos.html" class="active" accesskey="j">Juegos</a>
            <a href="ayuda.html" accesskey="a">Ayuda</a>
        </nav>
    </header>
    <p>Estás en: <a href="index.html">Inicio</a> >> <a href="juegos.html">Juegos</a> >> Cronómetro</p>
    <main>
        <h2>Cronómetro</h2>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const contenedor = document.getElementById('cronometro');
                const crono = new Cronometro(contenedor);

                document.getElementById('btn-arrancar').addEventListener('click', () => crono.arrancar());
                document.getElementById('btn-parar').addEventListener('click', () => crono.parar());
                document.getElementById('btn-reiniciar').addEventListener('click', () => crono.reiniciar());
            });
        </script>

        <section>
            <p id="cronometro">00:00.0</p>
            <button id="btn-arrancar" type="button" aria-controls="crono-display">Arrancar</button>
            <button id="btn-parar" type="button" aria-controls="crono-display">Parar</button>
            <button id="btn-reiniciar" type="button" aria-controls="crono-display">Reiniciar</button>
        </section>

        <noscript>
            <p>El cronómetro requiere JavaScript. Por favor, habilítalo en tu navegador.</p>
        </noscript>

    </main>

    <footer>
        <nav>
            <a href="index.html" accesskey="i">Inicio</a>

        </p>
    </footer>
</body>
